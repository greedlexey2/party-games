<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#120e33">
<title>Игра</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Golos+Text:wght@400;500;600;700;800&family=JetBrains+Mono:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=12">
<style>
  body { padding: 14px 16px calc(20px + env(safe-area-inset-bottom)); }
  main { max-width: 520px; margin: 0 auto; }
  .top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; min-height: 36px; }
  .top .score { font-family: var(--display); color: var(--gold); font-size: 20px; }
  .hero { padding: 48px 4px 24px; text-align: center; }
  .hero h1 { font-size: 30px; line-height: 1.1; }
  .opts { display: grid; gap: 10px; margin-top: 16px; }
  .q { font-size: 19px; font-weight: 700; line-height: 1.3; }
  .status { text-align: center; padding: 14px; font-weight: 700; }
  .big-msg { font-family: var(--display); font-size: 24px; text-align: center; margin: 22px 0 8px; }
  .board .cat { grid-template-columns: repeat(var(--n,5), minmax(0, 1fr)); }
  .codein { font-family: var(--mono); font-size: 26px; font-weight: 800; letter-spacing: .3em; text-align: center; text-transform: uppercase; }
  .codein::placeholder { font-family: 'Golos Text', system-ui, sans-serif; font-size: 16px; font-weight: 500; letter-spacing: normal; text-transform: none; }
  .err { margin: 0; color: #ff9aa0; font-weight: 600; text-align: center; }
  .or { display: flex; align-items: center; gap: 12px; margin: 30px 0 22px; color: var(--mute); font-size: 14px; }
  .or::before, .or::after { content: ''; flex: 1; height: 2px; background: var(--line); }
  a.btn { display: block; text-align: center; text-decoration: none; }
  .top span:first-child, .hero h1, .q, .big-msg { overflow-wrap: anywhere; }
  .top span:first-child { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; margin-right: 12px; }
  .board .cname { grid-column: 1 / -1; background: none; border: 0; padding: 6px 2px 0; color: var(--mute); font-size: 13px; text-transform: uppercase; letter-spacing: .06em; }
  .cell { min-height: 48px; font-size: 15px; }
</style>
</head>
<body>
<main id="app"></main>
<script src="config.js?v=12"></script><script src="common.js?v=12"></script>
<script>
let pid = null;
try { pid = localStorage.getItem('pid'); } catch {}
if (!pid) { pid = (crypto.randomUUID ? crypto.randomUUID() : Math.random().toString(36).slice(2) + Date.now()); try { localStorage.setItem('pid', pid); } catch {} }
let name = '';
let S = null, joined = false, lastBuzz = null;
const ROOM = (new URLSearchParams(location.search).get('room') || '').toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, 6);
const app = $('#app');

const net = connect({
  open() { if (ROOM) net.send({ t: 'join', room: ROOM, pid }); }, // known device -> straight back in; new -> name form
  noRoom() { joined = false; S = null; renderHome('Комнаты с кодом ' + ROOM + ' нет. Проверь код или спроси у ведущего новую ссылку.'); },
  needName() { joined = false; renderJoin(); },
  rejected() { joined = false; S = null; app.innerHTML = `<div class="hero"><h1>Хост не пустил</h1><p class="mute">Можно попробовать ещё раз</p><button class="btn" onclick="location.reload()">Ещё раз</button></div>`; },
  closed() { joined = false; S = null; app.innerHTML = `<div class="hero pop"><h1>Игра уже идёт</h1><p class="mute" style="margin-top:12px">Вход закрыт. Если ты уже играл(а) — введи то же имя, что было.</p><button class="btn" style="margin-top:18px" onclick="renderJoin()">Ввести имя</button></div>`; },
  pid(m) { pid = m.pid; try { localStorage.setItem('pid', pid); } catch {} },
  state(m) { S = m.s; S.at = Date.now(); joined = true; render(); },
});

function renderJoin() {
  app.innerHTML = `<div class="hero">
    <p class="tag">Комната ${esc(ROOM)}</p>
    <h1 style="margin-top:16px">Как тебя зовут?</h1>
    <p class="mute">Напиши имя — под ним ты будешь в таблице очков.</p>
  </div>
  <form id="jf" class="col">
    <input id="nm" maxlength="20" placeholder="Имя" autocomplete="off" required>
    <button class="btn">Отправить заявку</button>
  </form>`;
  $('#jf').onsubmit = e => {
    e.preventDefault(); name = $('#nm').value.trim(); if (!name) return;
        net.send({ t: 'join', room: ROOM, pid, name });
  };
  $('#nm').focus();
}
// Home: enter a room code, or become a host and create a room.
function renderHome(err) {
  app.innerHTML = `<div class="hero">
    <p class="tag">Игры для компании</p>
    <h1 style="margin-top:16px">Есть код комнаты?</h1>
    <p class="mute">Его покажет ведущий на своём экране, рядом с QR-кодом.</p>
  </div>
  <form id="rf" class="col">
    <input id="code" maxlength="6" placeholder="Например, K7QX" autocomplete="off" autocapitalize="characters" class="codein" required>
    ${err ? `<p class="err">${esc(err)}</p>` : ''}
    <button class="btn">Войти в комнату</button>
  </form>
  <div class="or"><span>или</span></div>
  <div class="col center">
    <p class="mute" style="margin:0">Хочешь провести игру сам?</p>
    <a class="btn ghost" href="host.html?new=1">Создать комнату</a>
  </div>`;
  $('#rf').onsubmit = e => {
    e.preventDefault();
    const c = $('#code').value.toUpperCase().replace(/[^A-Z0-9]/g, '');
    if (c) location.search = '?room=' + c;
  };
}
if (ROOM) app.innerHTML = '<p class="center mute" style="margin-top:40vh">Подключаемся…</p>';
else renderHome();

function topBar() {
  return `<div class="top"><span class="mute">${esc(S.me.name)}</span><span class="score">${fmt(S.me.score)}</span></div>`;
}

function render() {
  if (!S || !S.me) return renderJoin();
  if (S.me.status === 'pending') {
    app.innerHTML = `<div class="hero pop"><p class="tag">Заявка отправлена</p><h1 style="margin-top:16px">Ждём ведущего</h1><p class="mute" style="margin-top:12px">Он запустит всех в комнату, когда соберёмся. Не закрывай страницу.</p><p class="namecard">${esc(S.me.name)}</p></div>`;
    return;
  }
  let h = topBar();
  if (S.mode === 'lobby') {
    h += `<div class="big-msg">Ты в комнате</div><p class="center mute">Скоро начнём. Смотри на большой экран.</p>
      <h3 style="margin:24px 0 10px;font-size:15px" class="mute">Игроки · ${S.players.length}</h3>${leaderboard(S.players, pid)}`;
  } else if (S.mode === 'final') {
    h += `<div class="big-msg">Итоги</div>${leaderboard(S.players, pid)}`;
  } else if (S.mode === 'mill' && S.mill) h += mill(S.mill);
  else if (S.mode === 'melody' && S.melody) h += melody(S.melody);
  app.innerHTML = h;

  app.querySelectorAll('[data-a]').forEach(b => b.onclick = () => { net.send({ t: 'answer', i: +b.dataset.a }); navigator.vibrate && navigator.vibrate(20); });
  app.querySelectorAll('[data-pick]').forEach(b => b.onclick = () => { const [c, r] = b.dataset.pick.split(','); net.send({ t: 'pick', c: +c, r: +r }); });
  const bz = $('#buzz'); if (bz) bz.onpointerdown = e => { e.preventDefault(); net.send({ t: 'buzz' }); navigator.vibrate && navigator.vibrate(40); };
}

function mill(m) {
  let h = `<div class="row" style="justify-content:space-between"><span class="tag">Вопрос ${m.idx + 1} из ${m.total}</span><span class="num gold">${fmt(m.value)}</span></div>
    <p class="q">${esc(m.q)}</p><div class="opts">`;
  m.a.forEach((t, i) => {
    let c = '';
    if (m.hidden.includes(i)) c = 'gone';
    if (m.mine === i) c = 'sel';
    if (m.phase !== 'question') { if (i === m.correct) c = 'right'; else if (m.mine === i) c = 'wrong'; }
    const dis = m.phase !== 'question' || m.mine !== undefined || m.hidden.includes(i);
    h += `<button class="opt ${c}" ${dis ? 'disabled' : `data-a="${i}"`}><span><b>${L[i]}:</b> ${esc(t)}</span></button>`;
  });
  h += `</div>` + lifelinesHtml(m, S.at);
  if (m.phase === 'question') h += `<div class="status ${m.mine !== undefined ? 'gold' : 'mute'}">${m.mine === undefined ? 'Выбери ответ'
    : m.answered >= m.players ? 'Ответ принят. Ведущий сейчас покажет правильный'
    : `Ответ принят. Ответили ${m.answered} из ${m.players}`}</div>`;
  else h += m.mine === m.correct
    ? `<div class="big-msg pop" style="color:var(--ok)">+${fmt(m.value)}</div>`
    : `<div class="status" style="color:var(--bad)">${m.mine === undefined ? 'Ты не успел(а) ответить' : 'Мимо'}</div>`;
  return h;
}

function melody(m) {
  let h = '';
  if (m.phase === 'board') {
    if (m.last) h += `<div class="panel center pop" style="margin-bottom:14px"><div class="mute" style="font-size:13px">Это была</div><div style="font-weight:800;font-size:18px">${esc(m.last.answer)}</div>
      <div class="${m.last.winner ? 'gold' : 'mute'}" style="margin-top:4px">${m.last.winner ? esc(m.last.winner) + ' +' + m.last.points : 'Никто не угадал'}</div></div>`;
    h += m.chooserIsMe ? `<div class="status gold">Твой выбор — нажми клетку</div>`
      : `<div class="status mute">${m.chooserName ? 'Выбирает ' + esc(m.chooserName) : 'Хост выбирает клетку'}</div>`;
    h += boardHtml(m, m.chooserIsMe);
  } else {
    h += `<div class="center" style="margin:8px 0 22px"><span class="tag">${esc(m.cur.cat)}</span> <span class="num gold" style="margin-left:6px">${m.cur.points}</span></div>`;
    if (m.phase === 'open') {
      h += m.lockedMe
        ? `<button class="buzz" disabled>МИМО</button><p class="center mute" style="margin-top:20px">В этот раз ты уже отвечал(а) — −${m.cur.points}</p>`
        : `<button class="buzz" id="buzz">ОТВЕТИТЬ</button><p class="center mute" style="margin-top:24px">Знаешь песню? Жми первым.<br>Ошибка: −${m.cur.points}</p>`;
    } else if (m.phase === 'buzzed') {
      h += m.buzzIsMe
        ? `<div class="big-msg pop" style="color:var(--gold);font-size:30px">Ты отвечаешь!</div><p class="center">Говори название вслух</p>`
        : `<button class="buzz" disabled>ЖДИ</button><p class="center" style="margin-top:20px">Отвечает <b>${esc(m.buzzName)}</b></p>`;
      if (m.buzzIsMe && lastBuzz !== m.cur.c + '-' + m.cur.r) { lastBuzz = m.cur.c + '-' + m.cur.r; navigator.vibrate && navigator.vibrate([60, 40, 60]); }
    }
  }
  return h;
}
</script>
</body>
</html>
